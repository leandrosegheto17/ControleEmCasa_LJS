# Purga diária (RN-26, CA-19.8, CA-23.12; SDD D-05; G-49; ADR-013): `backend/scripts/purgar.ts` com a role owner.
# Segredos só por referência ao environment `producao` (criado na etapa 17). Enquanto a variável PURGA_ATIVA do
# repositório não for 'true', o job não roda (não há banco de produção antes da etapa 17).
name: purga

on:
  schedule:
    # 08:00 UTC = 05:00 em Brasília, depois do backup diário das 04:00 (SDD 11, etapa 16).
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purga
  cancel-in-progress: false

jobs:
  purgar:
    if: ${{ vars.PURGA_ATIVA == 'true' }}
    runs-on: ubuntu-latest
    environment: producao
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Purgar exclusões vencidas, ex-membros, contas não confirmadas e podar
        run: pnpm --filter @controle/scripts purgar
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          ASAAS_API_URL: ${{ vars.ASAAS_API_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
