# Deploy de produção (etapa 16; PLANO; SDD 11.1, 11.2; G-02, G-09, G-42, G-43, G-44; TM-DB-02, TM-DB-05, TM-DB-07,
# TM-GH-01 a TM-GH-04; ADR-015). ÚNICO lugar com `wrangler deploy` (teste operacao/wrangler-deploy-unico.test.ts).
#
# Gatilho: só manual (workflow_dispatch, sem inputs), a partir da `main`; publica a ponta da `main` no momento do
# disparo (github.sha). O job `conferir` (sem segredo e sem environment) só deixa seguir se o workflow `ci` desse SHA,
# num push à `main`, terminou com sucesso; CI em andamento, vermelho, cancelado ou inexistente falha com erro claro.
# Disparo: `gh workflow run deploy --ref main` ou Actions -> deploy -> Run workflow (runbook, seção 2).
#
# Ordem fixa (G-43): build -> cache do Hyperdrive conferido -> branch de restauração no Neon (mantém 2) -> dump
# cifrado com age -> migração com a role owner -> wrangler deploy -> saúde. Qualquer passo que falha para tudo.
#
# Environment: o `publicar` roda no `producao` (segredos, só da main, sem revisor). Emenda de 2026-10-27 ao ADR-015: o
# GitHub Free não permite revisor obrigatório em repositório privado, então a pausa de aprovação deu lugar ao disparo
# manual; o backup e a purga, que também leem o `producao`, continuam sem esperar ninguém.
#
# Inerte até a etapa 17: enquanto a variável DEPLOY_ATIVO do repositório não for 'true', nenhum job roda.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  conferir:
    if: ${{ vars.DEPLOY_ATIVO == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Conferir o CI verde no commit disparado
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          run_ci=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=main&event=push&per_page=1" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
          if [ -z "$run_ci" ]; then
            echo "::error title=Sem CI para este commit::Nenhum run do workflow ci num push à main para ${SHA}. Espere o CI do push terminar e dispare de novo."
            exit 1
          fi
          read -r estado conclusao url <<< "$run_ci"
          if [ "$estado" != "completed" ] || [ "$conclusao" != "success" ]; then
            echo "::error title=CI não está verde::O ci de ${SHA} está ${estado}/${conclusao} (${url}). Só se publica commit com o CI concluído com sucesso."
            exit 1
          fi
          echo "CI verde para ${SHA}: ${url}"

  publicar:
    needs: conferir
    if: ${{ vars.DEPLOY_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://controleemcasa.ljssoftware.com.br
    timeout-minutes: 30
    env:
      SHA: ${{ github.sha }}
      URL_PUBLICA: https://controleemcasa.ljssoftware.com.br
      ASAAS_API_URL: https://api.asaas.com/v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 1. Build do front (antes de tocar em qualquer coisa de produção)
        env:
          # Sentry do front (etapa 16): DSN por variável do environment (sem ela, o Sentry fica desligado) e
          # release = SHA do commit publicado.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm --filter @controle/web build

      - name: 2. Conferir o cache do Hyperdrive desligado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @controle/scripts cache-hyperdrive

      - name: 3. Branch de restauração no Neon (mantém as 2 mais novas)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: pnpm --filter @controle/scripts restauracao-neon

      - name: 4. Dump cifrado antes da migração
        uses: ./.github/actions/dump-cifrado
        with:
          url: ${{ secrets.DATABASE_URL_BACKUP }}
          destinatario: ${{ vars.AGE_RECIPIENT }}
          nome-artefato: dump-predeploy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 5. Migrar com a role owner
        id: migrar
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
        run: pnpm --filter @controle/scripts migrar

      - name: 6. Publicar o Worker
        id: publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @controle/api exec wrangler deploy -c ../../wrangler.jsonc --var "URL_PUBLICA:${URL_PUBLICA}" --var AMBIENTE:producao --var "ASAAS_API_URL:${ASAAS_API_URL}" --var "SENTRY_RELEASE:${SHA}"

      - name: 7. Conferir a saúde do app publicado
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "${URL_PUBLICA}/api/health"

      - name: Desfazer o Worker e orientar a restauração
        if: ${{ failure() && steps.migrar.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RESULTADO_PUBLICACAO: ${{ steps.publicar.outcome }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ "$RESULTADO_PUBLICACAO" = "success" ]; then
            pnpm --filter @controle/api exec wrangler rollback -c ../../wrangler.jsonc --message "Saude falhou no deploy ${RUN}"
          fi
          echo "::error title=Deploy falhou depois da migração::A migração já foi aplicada. Para voltar o banco, use a branch restauracao-${RUN} do Neon ou o artefato dump-predeploy-${RUN} (runbook)."
          exit 1
