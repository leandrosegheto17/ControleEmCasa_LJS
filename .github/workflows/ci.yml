name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # G-43: migration não aditiva (drop, rename, troca de tipo, NOT NULL sem default, truncate) só passa com a
      # anotação `-- migracao-nao-aditiva:` ligada a uma fase expand já publicada (no commit de base) ou a uma linha
      # aprovada do Log de Alterações. As exceções aceitas ficam impressas no log deste passo.
      - name: Migrations aditivas (G-43)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm --filter @controle/scripts migracoes-aditivas --base "$BASE"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: controle
          POSTGRES_USER: controle_owner
          POSTGRES_PASSWORD: controle_owner
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controle_owner -d controle"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EXIGIR_BANCO: '1'
      PGPASSWORD: controle_owner
      DATABASE_URL_OWNER: postgres://controle_owner:controle_owner@localhost:5432/controle
      DATABASE_URL_APP: postgres://controle_app:controle_app@localhost:5432/controle
      DATABASE_URL_BACKUP: postgres://controle_backup_ro:controle_backup_ro@localhost:5432/controle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Criar as roles (como o docker-entrypoint faz no local)
        run: psql -h localhost -U controle_owner -d controle -v ON_ERROR_STOP=1 -f backend/scripts/init-local.sql
      - name: Migrations do zero
        run: pnpm migrar
      - name: Testes de banco (Postgres 17 real)
        run: pnpm --filter @controle/scripts test
      - name: Testes da API no Workers (workerd + Postgres 17 real, banco descartável)
        run: pnpm --filter @controle/api test

  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar o Chromium do Playwright
        run: pnpm --filter @controle/web exec playwright install --with-deps chromium
      - name: e2e do front (Playwright, API simulada)
        run: pnpm --filter @controle/web e2e
        env:
          CI: 'true'

  # e2e críticos contra a pilha real (etapa 16): Worker no `wrangler dev` + Postgres 17 + Asaas simulado.
  e2e-pilha:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: controle
          POSTGRES_USER: controle_owner
          POSTGRES_PASSWORD: controle_owner
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controle_owner -d controle"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGPASSWORD: controle_owner
      DATABASE_URL_OWNER: postgres://controle_owner:controle_owner@localhost:5432/controle
      DATABASE_URL_APP: postgres://controle_app:controle_app@localhost:5432/controle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Criar as roles (como o docker-entrypoint faz no local)
        run: psql -h localhost -U controle_owner -d controle -v ON_ERROR_STOP=1 -f backend/scripts/init-local.sql
      - name: Instalar o Chromium do Playwright
        run: pnpm --filter @controle/web exec playwright install --with-deps chromium
      - name: e2e críticos (build do front, Worker local, banco descartável)
        run: pnpm --filter @controle/web e2e:pilha
        env:
          CI: 'true'

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
